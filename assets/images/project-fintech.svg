<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="#030712" />

  <!-- Phone Frame / App Mockup -->
  <g transform="translate(230, 25)">
    <!-- Device Body -->
    <rect width="340" height="430" rx="30" fill="#111827" stroke="#374151" stroke-width="4" />
    <!-- Dynamic Island / Speaker -->
    <rect x="120" y="10" width="100" height="18" rx="9" fill="#030712" />

    <!-- In-App Header -->
    <text x="30" y="55" fill="#9ca3af" font-family="sans-serif" font-size="11">Selamat Datang,</text>
    <text x="30" y="75" fill="#f9fafb" font-family="sans-serif" font-size="16" font-weight="bold">AetherPay Wallet</text>
    <circle cx="305" cy="65" r="15" fill="#1f2937" stroke="#4b5563" stroke-width="1" />

    <!-- Credit / Debit Card -->
    <g transform="translate(25, 95)">
      <rect width="290" height="150" rx="16" fill="url(#card-grad)" />
      <text x="25" y="35" fill="#fdf4ff" font-family="sans-serif" font-size="11" opacity="0.9">Total Saldo Aktif</text>
      <text x="25" y="68" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">$48,250.80</text>
      
      <circle cx="245" cy="40" r="14" fill="#ffffff" opacity="0.3" />
      <circle cx="260" cy="40" r="14" fill="#ffffff" opacity="0.3" />

      <text x="25" y="125" fill="#fdf4ff" font-family="monospace" font-size="12">••••  ••••  ••••  8829</text>
      <text x="240" y="125" fill="#fdf4ff" font-family="sans-serif" font-size="10">09/28</text>
    </g>

    <!-- Quick Action Buttons -->
    <g transform="translate(25, 260)">
      <!-- Send -->
      <circle cx="35" cy="25" r="22" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="35" y="30" fill="#38bdf8" font-size="16" text-anchor="middle">↑</text>
      <text x="35" y="60" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Kirim</text>

      <!-- Receive -->
      <circle cx="108" cy="25" r="22" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="108" y="30" fill="#34d399" font-size="16" text-anchor="middle">↓</text>
      <text x="108" y="60" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Terima</text>

      <!-- Top Up -->
      <circle cx="182" cy="25" r="22" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="182" y="30" fill="#fbbf24" font-size="16" text-anchor="middle">+</text>
      <text x="182" y="60" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Top Up</text>

      <!-- More -->
      <circle cx="255" cy="25" r="22" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="255" y="30" fill="#a78bfa" font-size="14" text-anchor="middle">•••</text>
      <text x="255" y="60" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Lainnya</text>
    </g>

    <!-- Recent Transactions Header -->
    <g transform="translate(25, 340)">
      <text x="0" y="15" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="bold">Transaksi Terkini</text>
      
      <!-- Tx 1 -->
      <rect y="25" width="290" height="45" rx="8" fill="#1f2937" />
      <circle cx="25" cy="48" r="12" fill="#374151" />
      <text x="48" y="44" fill="#f3f4f6" font-family="sans-serif" font-size="11" font-weight="bold">Apple Store Subscription</text>
      <text x="48" y="58" fill="#9ca3af" font-family="sans-serif" font-size="9">Hari ini, 10:45 AM</text>
      <text x="275" y="51" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">-$14.99</text>
    </g>
  </g>
</svg>
