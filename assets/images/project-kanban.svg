<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" rx="16" fill="#0f172a" />
  
  <!-- Kanban Header -->
  <rect x="40" y="30" width="720" height="50" rx="8" fill="#1e293b" />
  <rect x="60" y="47" width="140" height="16" rx="4" fill="#38bdf8" />
  <rect x="620" y="45" width="120" height="20" rx="6" fill="#6366f1" />
  <text x="680" y="59" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ New Task</text>

  <!-- 3 Columns -->
  <!-- Col 1: To Do -->
  <g transform="translate(40, 100)">
    <rect width="225" height="340" rx="10" fill="#182234" />
    <circle cx="25" cy="25" r="5" fill="#f59e0b" />
    <text x="40" y="29" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">To Do (3)</text>
    
    <!-- Card 1 -->
    <rect x="15" y="48" width="195" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="25" y="60" width="50" height="12" rx="3" fill="#ef4444" opacity="0.8"/>
    <rect x="25" y="80" width="150" height="10" rx="3" fill="#cbd5e1" />
    <rect x="25" y="96" width="100" height="8" rx="3" fill="#64748b" />
    <circle cx="185" cy="100" r="10" fill="#475569" />

    <!-- Card 2 -->
    <rect x="15" y="140" width="195" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="25" y="152" width="60" height="12" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="25" y="172" width="160" height="10" rx="3" fill="#cbd5e1" />
    <rect x="25" y="188" width="80" height="8" rx="3" fill="#64748b" />
    <circle cx="185" cy="192" r="10" fill="#475569" />

    <!-- Card 3 -->
    <rect x="15" y="232" width="195" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="25" y="244" width="55" height="12" rx="3" fill="#10b981" opacity="0.8"/>
    <rect x="25" y="264" width="130" height="10" rx="3" fill="#cbd5e1" />
    <rect x="25" y="280" width="90" height="8" rx="3" fill="#64748b" />
  </g>

  <!-- Col 2: In Progress -->
  <g transform="translate(288, 100)">
    <rect width="225" height="340" rx="10" fill="#182234" />
    <circle cx="25" cy="25" r="5" fill="#3b82f6" />
    <text x="40" y="29" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">In Progress (2)</text>
    
    <!-- Active Drag Card -->
    <rect x="15" y="48" width="195" height="95" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <rect x="25" y="60" width="65" height="12" rx="3" fill="#a855f7" opacity="0.8"/>
    <rect x="25" y="80" width="160" height="10" rx="3" fill="#f8fafc" />
    <rect x="25" y="96" width="140" height="8" rx="3" fill="#94a3b8" />
    <rect x="25" y="115" width="70" height="14" rx="4" fill="#334155" />
    <circle cx="185" cy="115" r="10" fill="#6366f1" />

    <!-- Card 2 -->
    <rect x="15" y="155" width="195" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="25" y="167" width="55" height="12" rx="3" fill="#f59e0b" opacity="0.8"/>
    <rect x="25" y="187" width="140" height="10" rx="3" fill="#cbd5e1" />
    <rect x="25" y="203" width="90" height="8" rx="3" fill="#64748b" />
  </g>

  <!-- Col 3: Done -->
  <g transform="translate(535, 100)">
    <rect width="225" height="340" rx="10" fill="#182234" />
    <circle cx="25" cy="25" r="5" fill="#10b981" />
    <text x="40" y="29" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Done (4)</text>
    
    <!-- Card 1 -->
    <rect x="15" y="48" width="195" height="80" rx="8" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1" />
    <rect x="25" y="60" width="60" height="12" rx="3" fill="#10b981" opacity="0.8"/>
    <rect x="25" y="80" width="150" height="10" rx="3" fill="#94a3b8" />
    <text x="185" y="105" fill="#10b981" font-family="sans-serif" font-size="14" text-anchor="middle">✓</text>

    <!-- Card 2 -->
    <rect x="15" y="140" width="195" height="80" rx="8" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1" />
    <rect x="25" y="152" width="60" height="12" rx="3" fill="#10b981" opacity="0.8"/>
    <rect x="25" y="172" width="130" height="10" rx="3" fill="#94a3b8" />
    <text x="185" y="197" fill="#10b981" font-family="sans-serif" font-size="14" text-anchor="middle">✓</text>
  </g>
</svg>
