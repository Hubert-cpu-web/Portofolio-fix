<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ecom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="ecom-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="ecom-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#ecom-bg)" />

  <!-- App Header -->
  <rect x="40" y="30" width="720" height="50" rx="10" fill="#1e293b" />
  <circle cx="70" cy="55" r="14" fill="#3b82f6" />
  <rect x="100" y="47" width="120" height="16" rx="4" fill="#f8fafc" />
  <rect x="520" y="45" width="150" height="20" rx="6" fill="#0f172a" />
  <circle cx="705" cy="55" r="12" fill="#64748b" />

  <!-- Stat Cards -->
  <g transform="translate(40, 95)">
    <!-- Card 1 -->
    <rect width="225" height="90" rx="10" fill="#131d31" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Total Penjualan</text>
    <text x="20" y="60" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">Rp 128.450.000</text>
    <text x="20" y="78" fill="#10b981" font-family="sans-serif" font-size="11">▲ +24.8% bln ini</text>

    <!-- Card 2 -->
    <rect x="245" width="225" height="90" rx="10" fill="#131d31" stroke="#334155" stroke-width="1" />
    <text x="265" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Pesanan Masuk</text>
    <text x="265" y="60" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">1,842 Order</text>
    <text x="265" y="78" fill="#10b981" font-family="sans-serif" font-size="11">▲ +12.3% minggu ini</text>

    <!-- Card 3 -->
    <rect x="490" width="230" height="90" rx="10" fill="#131d31" stroke="#334155" stroke-width="1" />
    <text x="510" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Pengunjung Aktif</text>
    <text x="510" y="60" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">34,120 User</text>
    <text x="510" y="78" fill="#38bdf8" font-family="sans-serif" font-size="11">● 420 online saat ini</text>
  </g>

  <!-- Big Chart & Table Section -->
  <g transform="translate(40, 200)">
    <!-- Chart Box -->
    <rect width="450" height="240" rx="10" fill="#131d31" stroke="#334155" stroke-width="1" />
    <text x="20" y="35" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Grafik Tren Penjualan Harian</text>
    <rect x="360" y="20" width="70" height="22" rx="4" fill="#1e293b" />
    <text x="375" y="35" fill="#94a3b8" font-family="sans-serif" font-size="10">30 Hari</text>

    <!-- Chart Grid Lines -->
    <line x1="20" y1="70" x2="430" y2="70" stroke="#1e293b" stroke-dasharray="4" />
    <line x1="20" y1="120" x2="430" y2="120" stroke="#1e293b" stroke-dasharray="4" />
    <line x1="20" y1="170" x2="430" y2="170" stroke="#1e293b" stroke-dasharray="4" />
    <line x1="20" y1="210" x2="430" y2="210" stroke="#334155" />

    <!-- Bar Chart Elements -->
    <rect x="40" y="110" width="22" height="100" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="75" y="80" width="22" height="130" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="110" y="130" width="22" height="80" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="145" y="95" width="22" height="115" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="180" y="60" width="22" height="150" rx="4" fill="#10b981" />
    <rect x="215" y="100" width="22" height="110" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="250" y="70" width="22" height="140" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="285" y="125" width="22" height="85" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="320" y="85" width="22" height="125" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="355" y="50" width="22" height="160" rx="4" fill="#10b981" />
    <rect x="390" y="75" width="22" height="135" rx="4" fill="#3b82f6" opacity="0.8"/>

    <!-- Right Side Mini Table / Top Products -->
    <rect x="470" y="0" width="250" height="240" rx="10" fill="#131d31" stroke="#334155" stroke-width="1" />
    <text x="490" y="35" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Produk Terlaris</text>

    <!-- Row 1 -->
    <circle cx="505" cy="70" r="14" fill="#1e293b" />
    <rect x="530" y="62" width="110" height="10" rx="3" fill="#e2e8f0" />
    <text x="690" y="72" fill="#10b981" font-family="sans-serif" font-size="11" text-anchor="end">412 pcs</text>

    <!-- Row 2 -->
    <circle cx="505" cy="115" r="14" fill="#1e293b" />
    <rect x="530" y="107" width="130" height="10" rx="3" fill="#e2e8f0" />
    <text x="690" y="117" fill="#10b981" font-family="sans-serif" font-size="11" text-anchor="end">328 pcs</text>

    <!-- Row 3 -->
    <circle cx="505" cy="160" r="14" fill="#1e293b" />
    <rect x="530" y="152" width="95" height="10" rx="3" fill="#e2e8f0" />
    <text x="690" y="162" fill="#10b981" font-family="sans-serif" font-size="11" text-anchor="end">294 pcs</text>

    <!-- Row 4 -->
    <circle cx="505" cy="205" r="14" fill="#1e293b" />
    <rect x="530" y="197" width="120" height="10" rx="3" fill="#e2e8f0" />
    <text x="690" y="207" fill="#10b981" font-family="sans-serif" font-size="11" text-anchor="end">180 pcs</text>
  </g>
</svg>
