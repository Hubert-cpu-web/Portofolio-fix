<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Sphere Radial Chrome Gradient -->
    <radialGradient id="chrome-sphere" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#e2e8f0" />
      <stop offset="38%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Ring Metallic Linear Gradient -->
    <linearGradient id="ring-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#334155" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Specular Glow -->
    <filter id="glow-orb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="ring-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Orbital Ring Back Section (Behind Sphere) -->
  <g transform="rotate(-32 250 250)">
    <!-- Back arc of ellipse -->
    <path d="M 50,250 A 200,60 0 0,1 450,250" fill="none" stroke="url(#ring-chrome)" stroke-width="14" stroke-linecap="round" opacity="0.85" />
    <path d="M 50,250 A 200,60 0 0,1 450,250" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.95" />
  </g>

  <!-- Central Chrome Sphere -->
  <circle cx="250" cy="250" r="105" fill="url(#chrome-sphere)" />
  <!-- Sphere Highlight / Reflection Arc -->
  <ellipse cx="225" cy="215" rx="36" ry="24" fill="#ffffff" opacity="0.65" transform="rotate(-25 225 215)" />
  <circle cx="215" cy="205" r="8" fill="#ffffff" opacity="0.9" />

  <!-- Orbital Ring Front Section (In Front of Sphere) -->
  <g transform="rotate(-32 250 250)">
    <!-- Front arc of ellipse -->
    <path d="M 450,250 A 200,60 0 0,1 50,250" fill="none" stroke="url(#ring-chrome)" stroke-width="14" stroke-linecap="round" />
    <path d="M 450,250 A 200,60 0 0,1 50,250" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.95" />
    <!-- Outer thin glow halo ring -->
    <path d="M 465,250 A 215,70 0 0,1 35,250" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Subtle Ambient Orange Warmth (Apricot Princess Vibe) -->
  <circle cx="250" cy="250" r="120" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.15" />
</svg>
