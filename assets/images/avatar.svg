<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Glowing Circle Background -->
  <circle cx="200" cy="200" r="190" fill="#0f172a" stroke="url(#avatar-bg)" stroke-width="6" />

  <g transform="translate(0, 10)">
    <!-- Hair back -->
    <path d="M120 180 C110 100 290 100 280 180 Z" fill="#1e293b" />
    
    <!-- Shoulders / Hoodie -->
    <path d="M90 380 C100 280 140 250 200 250 C260 250 300 280 310 380 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M160 250 L180 320 L220 320 L240 250 Z" fill="#0f172a" />
    <!-- Laptop / Tech light reflection -->
    <polygon points="120,380 280,380 250,340 150,340" fill="#38bdf8" opacity="0.3" />

    <!-- Head & Face -->
    <ellipse cx="200" cy="180" rx="65" ry="75" fill="url(#skin)" />

    <!-- Hair front -->
    <path d="M130 160 C130 110 170 85 220 85 C270 85 275 125 270 150 C250 120 220 120 190 130 C160 140 140 145 130 160 Z" fill="#0f172a" />

    <!-- Glasses Frame -->
    <!-- Left lens -->
    <rect x="150" y="160" width="40" height="30" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#0284c7" stroke-width="3" />
    <!-- Right lens -->
    <rect x="210" y="160" width="40" height="30" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#0284c7" stroke-width="3" />
    <!-- Bridge -->
    <line x1="190" y1="175" x2="210" y2="175" stroke="#0284c7" stroke-width="3" />
    <!-- Temple arms -->
    <line x1="150" y1="175" x2="135" y2="170" stroke="#0284c7" stroke-width="3" />
    <line x1="250" y1="175" x2="265" y2="170" stroke="#0284c7" stroke-width="3" />

    <!-- Eyes (smiling behind lenses) -->
    <circle cx="170" cy="175" r="4" fill="#0f172a" />
    <circle cx="230" cy="175" r="4" fill="#0f172a" />

    <!-- Smile -->
    <path d="M185 215 Q200 228 215 215" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Floating Badge: Code Tag -->
    <g transform="translate(260, 90)">
      <rect width="80" height="32" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
      <text x="40" y="21" fill="#818cf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;dev/&gt;</text>
    </g>
  </g>
</svg>
