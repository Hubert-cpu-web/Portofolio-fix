<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg-grad)" rx="16"/>

  <!-- Decorative Glow Spots -->
  <circle cx="150" cy="120" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="680" cy="380" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Code / Browser Window Frame -->
  <g transform="translate(60, 40)">
    <!-- Window Container -->
    <rect width="680" height="400" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="680" height="42" rx="12" fill="#1e293b" />
    <rect y="30" width="680" height="12" fill="#1e293b" />
    <line x1="0" y1="42" x2="680" y2="42" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />

    <!-- Address / Search Bar -->
    <rect x="100" y="10" width="480" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="120" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://portfolio.dev/showcase</text>
    
    <!-- Code Editor Sidebar (Left) -->
    <rect x="0" y="43" width="180" height="357" fill="#0d1322" />
    <line x1="180" y1="43" x2="180" y2="400" stroke="#1e293b" stroke-width="1" />

    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">EXPLORER</text>
    <text x="20" y="105" fill="#38bdf8" font-family="monospace" font-size="11">📁 src</text>
    <text x="35" y="128" fill="#cbd5e1" font-family="monospace" font-size="11">📄 index.html</text>
    <text x="35" y="151" fill="#cbd5e1" font-family="monospace" font-size="11">🎨 style.css</text>
    <text x="35" y="174" fill="#facc15" font-family="monospace" font-size="11">⚡ projects.js</text>
    <text x="35" y="197" fill="#38bdf8" font-family="monospace" font-size="11">🚀 main.js</text>
    
    <!-- Status Pill -->
    <rect x="20" y="340" width="140" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="34" cy="353" r="4" fill="#10b981" />
    <text x="46" y="357" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">LIVE PREVIEW</text>

    <!-- Main Content Preview (Right) -->
    <g transform="translate(200, 55)">
      <!-- Mini Hero Card -->
      <rect width="460" height="120" rx="10" fill="#131b2e" stroke="#1e293b" stroke-width="1" />
      
      <!-- Avatar Circle in Mini Hero -->
      <circle cx="45" cy="50" r="25" fill="url(#accent-purple)" />
      <text x="45" y="55" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
      
      <!-- Mini Headline -->
      <rect x="85" y="32" width="160" height="12" rx="4" fill="#38bdf8" />
      <rect x="85" y="52" width="280" height="8" rx="3" fill="#64748b" />
      <rect x="85" y="66" width="220" height="8" rx="3" fill="#475569" />

      <!-- Mini Buttons -->
      <rect x="85" y="85" width="70" height="20" rx="4" fill="url(#accent-cyan)" />
      <rect x="165" y="85" width="70" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />

      <!-- Mini Project Grid (2 Cards) -->
      <rect x="0" y="135" width="222" height="190" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1" />
      <rect x="10" y="145" width="202" height="90" rx="6" fill="#1e293b" />
      <text x="111" y="195" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">⚡ Project 1</text>
      <rect x="15" y="248" width="120" height="10" rx="3" fill="#f8fafc" />
      <rect x="15" y="265" width="180" height="7" rx="3" fill="#64748b" />
      <rect x="15" y="278" width="140" height="7" rx="3" fill="#475569" />
      <rect x="15" y="300" width="50" height="14" rx="3" fill="#334155" />
      <rect x="70" y="300" width="50" height="14" rx="3" fill="#334155" />

      <rect x="238" y="135" width="222" height="190" rx="8" fill="#131b2e" stroke="#a855f7" stroke-width="1.2" />
      <rect x="248" y="145" width="202" height="90" rx="6" fill="#2e1065" />
      <text x="349" y="195" fill="#c084fc" font-family="monospace" font-size="12" text-anchor="middle">🌟 This Website</text>
      <rect x="253" y="248" width="130" height="10" rx="3" fill="#f8fafc" />
      <rect x="253" y="265" width="170" height="7" rx="3" fill="#64748b" />
      <rect x="253" y="278" width="150" height="7" rx="3" fill="#475569" />
      <rect x="253" y="300" width="60" height="14" rx="3" fill="#7e22ce" />
      <rect x="320" y="300" width="55" height="14" rx="3" fill="#334155" />
    </g>
  </g>
</svg>
