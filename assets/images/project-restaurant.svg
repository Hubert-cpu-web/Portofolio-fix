<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" rx="16" fill="#18181b" />
  
  <!-- Hero Section of Resto Website -->
  <g transform="translate(40, 30)">
    <rect width="720" height="60" rx="10" fill="#27272a" />
    <text x="30" y="38" fill="#f59e0b" font-family="'Georgia', serif" font-size="20" font-weight="bold">SeleraRasa Dining</text>
    <rect x="580" y="16" width="110" height="28" rx="6" fill="#f59e0b" />
    <text x="635" y="34" fill="#18181b" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Reservasi Meja</text>
  </g>

  <!-- Big Hero Banner -->
  <g transform="translate(40, 105)">
    <rect width="720" height="180" rx="12" fill="#2d1c13" stroke="#78350f" stroke-width="1.5" />
    <circle cx="580" cy="90" r="65" fill="#f59e0b" opacity="0.2" />
    <text x="40" y="65" fill="#fef3c7" font-family="'Georgia', serif" font-size="24" font-weight="bold">Sensasi Kuliner Nusantara Modern</text>
    <text x="40" y="95" fill="#d97706" font-family="sans-serif" font-size="13">Dipadukan dengan bahan organik pilihan dan sentuhan Chef Bintang 5</text>
    <rect x="40" y="120" width="130" height="34" rx="6" fill="#d97706" />
    <text x="105" y="141" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Eksplor Menu</text>
    
    <!-- Decorative Plate -->
    <circle cx="580" cy="90" r="55" fill="#1c1917" stroke="#f59e0b" stroke-width="2" />
    <circle cx="580" cy="90" r="35" fill="#f59e0b" opacity="0.6"/>
    <text x="580" y="95" fill="#ffffff" font-family="sans-serif" font-size="18" text-anchor="middle">🍲</text>
  </g>

  <!-- Menu Cards Preview -->
  <g transform="translate(40, 305)">
    <!-- Card 1 -->
    <rect width="220" height="135" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <circle cx="40" cy="40" r="20" fill="#3f3f46" />
    <text x="40" y="46" font-size="16" text-anchor="middle">🥩</text>
    <text x="75" y="35" fill="#f4f4f5" font-family="sans-serif" font-size="13" font-weight="bold">Rendang Wagyu</text>
    <text x="75" y="52" fill="#f59e0b" font-family="sans-serif" font-size="11">Rp 185.000</text>
    <text x="20" y="85" fill="#a1a1aa" font-family="sans-serif" font-size="10">Daging wagyu melt-in-mouth berpadu rempah Minang.</text>
    <rect x="20" y="100" width="80" height="20" rx="4" fill="#3f3f46" />
    <text x="60" y="114" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="middle">★★★★★ 4.9</text>

    <!-- Card 2 -->
    <rect x="250" width="220" height="135" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <circle cx="290" cy="40" r="20" fill="#3f3f46" />
    <text x="290" y="46" font-size="16" text-anchor="middle">🐟</text>
    <text x="325" y="35" fill="#f4f4f5" font-family="sans-serif" font-size="13" font-weight="bold">Gurame Terbang</text>
    <text x="325" y="52" fill="#f59e0b" font-family="sans-serif" font-size="11">Rp 95.000</text>
    <text x="270" y="85" fill="#a1a1aa" font-family="sans-serif" font-size="10">Renyah gurih dengan sambal matah dan terasi bakar.</text>
    <rect x="270" y="100" width="80" height="20" rx="4" fill="#3f3f46" />
    <text x="310" y="114" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="middle">★★★★★ 4.8</text>

    <!-- Card 3 -->
    <rect x="500" width="220" height="135" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <circle cx="540" cy="40" r="20" fill="#3f3f46" />
    <text x="540" y="46" font-size="16" text-anchor="middle">🍧</text>
    <text x="575" y="35" fill="#f4f4f5" font-family="sans-serif" font-size="13" font-weight="bold">Es Cendol Durian</text>
    <text x="575" y="52" fill="#f59e0b" font-family="sans-serif" font-size="11">Rp 45.000</text>
    <text x="520" y="85" fill="#a1a1aa" font-family="sans-serif" font-size="10">Gula aren organik asli dengan durian montong.</text>
    <rect x="520" y="100" width="80" height="20" rx="4" fill="#3f3f46" />
    <text x="560" y="114" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="middle">★★★★★ 5.0</text>
  </g>
</svg>
